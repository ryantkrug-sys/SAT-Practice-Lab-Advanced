<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SAT Practice Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#173052;font-family:Arial,Helvetica,sans-serif}.shell{max-width:1500px;margin:0 auto;padding:24px 28px}.brand{font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 24px}.card{background:#fff;border:1px solid #d5dfeb;border-radius:24px;padding:clamp(24px,4vw,54px);box-shadow:0 10px 35px rgba(20,50,80,.05)}.eyebrow{background:#e5eff9;border-radius:999px;padding:8px 14px;color:#17629b;font-weight:700;display:block}h1{font-size:clamp(30px,4vw,64px);margin:22px 0 12px}p{font-size:clamp(17px,1.5vw,24px);line-height:1.5;color:#4d6480}label{display:block;font-weight:700;margin:30px 0 12px;font-size:clamp(18px,1.5vw,24px)}select,button{font:inherit;border-radius:12px;padding:18px 20px;font-size:clamp(17px,1.5vw,24px)}select{width:100%;border:1px solid #b8c9dd;background:#fff;color:#172d49}button{margin-top:24px;border:0;background:#176ca9;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.note{font-size:16px;margin-top:14px}
</style></head><body><main class="shell"><div class="brand">SAT Practice Lab · Mathematics & Reading/Writing</div><section class="card"><span class="eyebrow">SAT Practice Lab</span><h1>Choose a practice test</h1><p>Select a domain below to practice. Domains without completed question banks are marked Coming soon.</p><label for="domain">Domain</label><select id="domain"><option value="" selected disabled hidden>Choose a domain</option><optgroup label="Mathematics"><option value="algebra">Algebra</option><option value="advanced-math">Advanced Math</option><option value="problem-solving">Problem-Solving and Data Analysis</option><option value="geometry">Geometry and Trigonometry</option></optgroup><optgroup label="Reading & Writing"><option value="information-ideas">Information and Ideas</option><option value="craft-structure">Craft and Structure</option><option value="expression-ideas">Expression of Ideas</option><option value="standard-conventions">Standard English Conventions</option></optgroup></select><p class="note">Choose one of the available domains, then click Start Test.</p><button id="start" disabled>Start Test</button><p id="error" class="note" role="alert"></p></section></main>
<script>
const domain=document.getElementById('domain'),start=document.getElementById('start'),error=document.getElementById('error');
domain.addEventListener('change',()=>{start.disabled=!['algebra','advanced-math','problem-solving','geometry','information-ideas','craft-structure','expression-ideas','standard-conventions'].includes(domain.value);error.textContent='';});
start.addEventListener('click',()=>{const value=domain.value;const paths={'algebra':'algebra/index.html','advanced-math':'advanced-math/index.html','problem-solving':'problem-solving/index.html','geometry':'geometry/index.html','information-ideas':'information-ideas/index.html','craft-structure':'craft-structure/index.html','expression-ideas':'expression-ideas/index.html','standard-conventions':'standard-conventions/index.html'};if(paths[value])window.location.href=paths[value];});
</script></body></html>
